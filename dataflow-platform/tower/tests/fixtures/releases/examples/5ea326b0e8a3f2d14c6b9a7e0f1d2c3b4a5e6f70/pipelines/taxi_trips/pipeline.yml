dataset: taxi_trips
version: 3
owner: platform
description: NYC TLC yellow taxi trips, one monthly file per partition

source:
  url: https://d37ci6vzurychx.cloudfront.net/trip-data/yellow_tripdata_{partition}.parquet
  format: parquet
  partitions: { monthly: { start: 2024-01 } }

bronze:
  schema-evolution: rescue

silver:
  columns:
    - { name: tripId,           type: string,        required: true, from: "uuid()" }
    - { name: pickupTime,       type: timestamp_ntz, required: true, from: tpep_pickup_datetime }
    - { name: dropoffTime,      type: timestamp_ntz, required: true, from: tpep_dropoff_datetime }
    - { name: passengerCount,   type: int,                           from: passenger_count }
    - { name: tripDistance,     type: double,                        from: trip_distance }
    - { name: pickupLocationId, type: int,           required: true, from: PULocationID }
    - { name: fareAmount,       type: double,                        from: fare_amount }
    - { name: paymentType,      type: int,                           from: payment_type }
  derive:
    - { name: tripMinutes, type: double, from: "timestampdiff(SECOND, pickupTime, dropoffTime) / 60" }
  expectations:
    - { name: pickup_in_file_month, check: "date_format(pickupTime, 'yyyy-MM') = regexp_extract(_source_file, 'tripdata_([0-9]{4}-[0-9]{2})', 1)", on-failure: drop }
    - { name: dropoff_after_pickup, check: "dropoffTime >= pickupTime",                                                                           on-failure: drop }
    - { name: fare_not_negative,    check: "fareAmount >= 0",                                                                                     on-failure: warn }
    - { name: known_payment_type,   check: "paymentType BETWEEN 0 AND 6",                                                                         on-failure: warn }

history:
  keys: [ pickupTime, dropoffTime, pickupLocationId, fareAmount ]
  stored-as: scd2
  track-history-except: [ tripId ]

references:
  - name: taxi_zones
    url: https://d37ci6vzurychx.cloudfront.net/misc/taxi_zone_lookup.csv
    format: csv
    options: { header: "true", inferSchema: "true" }

gold:
  - name: daily_zone_revenue
    sql: |
      SELECT to_date(c.pickupTime)          AS day,
             coalesce(z.Borough, 'Unknown') AS borough,
             coalesce(z.Zone, 'Unknown')    AS zone,
             coalesce(c.paymentType, 5)     AS paymentType,
             count(*)                       AS trips,
             round(sum(c.fareAmount), 2)    AS revenue,
             round(avg(c.tripDistance), 2)  AS avgDistance,
             round(avg(c.tripMinutes), 1)   AS avgMinutes
      FROM current c
      LEFT JOIN taxi_zones z ON c.pickupLocationId = z.LocationID
      GROUP BY 1, 2, 3, 4

serve:
  - { from: current,                 table: taxi_trips,              mode: view }
  - { from: gold.daily_zone_revenue, table: taxi_daily_zone_revenue, mode: copy, order-by: "(day, borough, zone, paymentType)" }

compute:
  executors: { max: 6 }
  spark-conf: { spark.sql.adaptive.enabled: "false" }
