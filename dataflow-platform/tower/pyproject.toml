[project]
name = "dataflow-tower"
version = "3.0.0"
description = "The tower: Dagster definitions built from the pipeline specs"
requires-python = ">=3.12,<3.15"
dependencies = [
    "dagster==1.13.26",
    "dagster-webserver==1.13.26",
    "dagster-postgres==0.29.26",
    "dagster-docker==0.29.26",
    "docker",
    "dagster-aws==0.29.26",
    "sqlalchemy<2.1",
    "pyyaml",
    "s3fs==2026.9.0",
    "cryptography>=44",
]

[project.optional-dependencies]
kubernetes = ["dagster-k8s==0.29.26"]
test = ["pytest", "dagster-k8s==0.29.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dataflow_tower = ["defs/**/*.yaml"]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "dataflow_tower"
code_location_name = "dataflow"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
