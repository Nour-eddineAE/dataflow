[project]
name = "dataflow-cli"
version = "3.0.0"
description = "DataFlow from a terminal or a CI job"
requires-python = ">=3.12"

[project.scripts]
dataflow = "dataflow_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
