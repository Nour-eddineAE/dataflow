services:
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION}
    container_name: dataflow-mailpit
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_RELAY_HOST: ${MAILPIT_RELAY_HOST}
      MP_SMTP_RELAY_PORT: ${MAILPIT_RELAY_PORT}
      MP_SMTP_RELAY_STARTTLS: "true"
      MP_SMTP_RELAY_AUTH: plain
      MP_SMTP_RELAY_USERNAME: ${MAILPIT_RELAY_USERNAME}
      MP_SMTP_RELAY_PASSWORD: ${MAILPIT_RELAY_PASSWORD:-}
      MP_SMTP_RELAY_ALLOWED_RECIPIENTS: ${MAILPIT_RELAY_RECIPIENTS}
      MP_SMTP_RELAY_MATCHING: ${MAILPIT_RELAY_RECIPIENTS}

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION}
    container_name: dataflow-grafana
    depends_on: [ mailpit ]
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT}/
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: DataFlow
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${ISSUER}/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/dataflow/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/dataflow/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'admins') && 'Admin' || 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ALLOWED_GROUPS: admins
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      GF_AUTH_OAUTH_AUTO_LOGIN: "true"
      GF_AUTH_SIGNOUT_REDIRECT_URL: ${ISSUER}/protocol/openid-connect/logout?client_id=grafana&post_logout_redirect_uri=http%3A%2F%2Flocalhost%3A${GRAFANA_PORT}%2F
      GF_DATE_FORMATS_FULL_DATE: YYYY-MM-DD HH:mm
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/Pipeline/runs.json
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_FROM_ADDRESS: alerts@dataflow.local
      GF_SMTP_FROM_NAME: DataFlow Alerts
      GF_SMTP_STARTTLS_POLICY: NoStartTLS
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      ALERT_EMAIL: ${ALERT_EMAIL}
      DATAFLOW_CH_PORT: 9000
      DATAFLOW_CH_DB: ${CLICKHOUSE_DB}
      DATAFLOW_CH_USER: ${CLICKHOUSE_USER}
      DATAFLOW_CH_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: ${GRAFANA_MEMORY}

  grafana-init:
    image: curlimages/curl:${CURL_VERSION}
    container_name: dataflow-grafana-init
    depends_on: [ grafana ]
    user: "0:0"
    entrypoint: [ "/bin/sh", "/init/workspace-token.sh" ]
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./grafana/workspace-token.sh:/init/workspace-token.sh:ro
      - grafana-token:/tokens

  spark-history:
    profiles: [ "spark-history" ]
    build:
      context: ./spark-history
      args:
        SPARK_VERSION: ${SPARK_VERSION}
        HADOOP_VERSION: ${HADOOP_VERSION}
        AWS_SDK_VERSION: ${AWS_SDK_VERSION}
    image: dataflow-spark-history:${SPARK_VERSION}
    container_name: dataflow-spark-history
    command: [ "/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer" ]
    environment:
      SPARK_DAEMON_MEMORY: ${SPARK_HISTORY_MEMORY}
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      SPARK_HISTORY_OPTS: >-
        -Dspark.history.fs.logDirectory=s3a://${LAKE_BUCKET}/spark-events/
        -Dspark.hadoop.fs.s3a.endpoint=http://rustfs:9000
        -Dspark.hadoop.fs.s3a.endpoint.region=us-east-1
        -Dspark.hadoop.fs.s3a.path.style.access=true

volumes:
  grafana-data:
