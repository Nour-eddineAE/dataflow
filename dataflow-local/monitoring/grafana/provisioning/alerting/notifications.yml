apiVersion: 1

contactPoints:
  - orgId: 1
    name: dataflow-email
    receivers:
      - uid: dataflow-email
        type: email
        settings:
          addresses: ${ALERT_EMAIL}
          singleEmail: true
          subject: '[DataFlow] {{ template "default.title" . }}'
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: dataflow-email
    group_by: ["grafana_folder", "alertname"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: dataflow-email
        object_matchers:
          - ["severity", "=", "critical"]
        repeat_interval: 1h
