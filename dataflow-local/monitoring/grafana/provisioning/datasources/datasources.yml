apiVersion: 1

datasources:
  - name: ClickHouse
    uid: dataflow-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    jsonData:
      host: clickhouse
      port: ${DATAFLOW_CH_PORT}
      protocol: native
      username: ${DATAFLOW_CH_USER}
      defaultDatabase: ${DATAFLOW_CH_DB}
    secureJsonData:
      password: ${DATAFLOW_CH_PASSWORD}
    editable: false
