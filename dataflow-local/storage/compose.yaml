services:
  rustfs-network:
    image: alpine/socat:${SOCAT_VERSION}
    container_name: dataflow-rustfs-network
    command: [ "TCP-LISTEN:${KEYCLOAK_PORT},fork,reuseaddr", "TCP:keycloak:8080" ]
    networks:
      default:
        aliases: [ rustfs ]
    ports:
      - "${RUSTFS_PORT}:9000"
      - "${RUSTFS_CONSOLE_PORT}:9001"
    mem_limit: 32m

  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION}
    container_name: dataflow-rustfs
    command: [ "/data" ]
    network_mode: service:rustfs-network
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_BROWSER_REDIRECT_URL: http://localhost:${RUSTFS_CONSOLE_PORT}
      RUSTFS_IDENTITY_OPENID_ENABLE: "on"
      RUSTFS_IDENTITY_OPENID_CONFIG_URL: ${ISSUER}
      RUSTFS_IDENTITY_OPENID_CLIENT_ID: rustfs-console
      RUSTFS_IDENTITY_OPENID_CLIENT_SECRET: ${RUSTFS_CONSOLE_CLIENT_SECRET}
      RUSTFS_IDENTITY_OPENID_SCOPES: openid,profile,email
      RUSTFS_IDENTITY_OPENID_ROLE_POLICY: dataflow_datasets
      RUSTFS_IDENTITY_OPENID_REDIRECT_URI: http://localhost:${RUSTFS_PORT}/rustfs/admin/v3/oidc/callback/default
      RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC: "off"
      RUSTFS_IDENTITY_OPENID_DISPLAY_NAME: DataFlow
      RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM: groups
      RUSTFS_IDENTITY_OPENID_ROLES_CLAIM: ""
      RUSTFS_IDENTITY_OPENID_EMAIL_CLAIM: email
      RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM: preferred_username
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: http://localhost:${KEYCLOAK_PORT}
      # Small heap: few threads, no object cache, freed memory returned at once.
      RUSTFS_RUNTIME_WORKER_THREADS: "2"
      RUSTFS_RUNTIME_MAX_BLOCKING_THREADS: "16"
      RUSTFS_RUNTIME_FSYNC_BLOCKING_THREADS: "4"
      RUSTFS_RUNTIME_THREAD_KEEP_ALIVE: "10"
      RUSTFS_OBJECT_DATA_CACHE_ENABLE: "false"
      RUSTFS_GET_OBJECT_METADATA_CACHE_MAX_ENTRIES: "256"
      RUSTFS_OBJECT_MAX_CONCURRENT_DISK_READS: "16"
      RUSTFS_ALLOCATOR_RECLAIM_INTERVAL_SECS: "10"
      MIMALLOC_PURGE_DELAY: "0"
      MIMALLOC_ARENA_EAGER_COMMIT: "0"
    depends_on:
      rustfs-network:
        condition: service_started
      keycloak-init:
        condition: service_completed_successfully
    mem_limit: ${RUSTFS_MEMORY}
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:9000/health || wget -qO- http://localhost:9000/health" ]
      interval: 10s
      timeout: 5s
      retries: 10

  buckets:
    image: curlimages/curl:${CURL_VERSION}
    container_name: dataflow-buckets
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      BUCKETS: ${LAKE_BUCKET} ${RELEASES_BUCKET}
      SPARK_EVENTS: ${LAKE_BUCKET}/spark-events/.keep
    entrypoint: [ "/bin/sh", "/scripts/buckets.sh" ]
    volumes:
      - ./buckets.sh:/scripts/buckets.sh:ro

  postgres:
    image: postgres:${POSTGRES_VERSION}
    container_name: dataflow-postgres
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: dataflow
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres" ]
      interval: 10s
      timeout: 5s
      retries: 10

  databases:
    image: postgres:${POSTGRES_VERSION}
    container_name: dataflow-databases
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      DATABASES: dagster workspace keycloak
    entrypoint: [ "/bin/sh", "/scripts/databases.sh" ]
    volumes:
      - ./databases.sh:/scripts/databases.sh:ro

  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    container_name: dataflow-clickhouse
    ports:
      - "${CLICKHOUSE_HTTP_PORT}:8123"
      - "${CLICKHOUSE_NATIVE_PORT}:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      LAKE_URL: http://rustfs:9000/${LAKE_BUCKET}/
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    mem_limit: ${CLICKHOUSE_MEMORY}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/lake.xml:/etc/clickhouse-server/config.d/lake.xml:ro
    configs:
      - source: clickhouse-lake-access
        target: /etc/clickhouse-server/users.d/lake-access.xml
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

configs:
  clickhouse-lake-access:
    content: |
      <clickhouse>
          <users>
              <${CLICKHOUSE_USER}>
                  <named_collection_control>1</named_collection_control>
              </${CLICKHOUSE_USER}>
          </users>
      </clickhouse>

volumes:
  postgres-data:
  clickhouse-data:
  rustfs-data:
