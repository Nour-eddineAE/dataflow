{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dataflow.name" . }}-postgres
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
data:
  init.sql: |
    CREATE DATABASE workspace;
    CREATE DATABASE dagster;
    CREATE DATABASE keycloak;
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dataflow.name" . }}-postgres
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: {{ .Values.postgres.port }}
      targetPort: postgres
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dataflow.name" . }}-postgres
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  serviceName: {{ include "dataflow.name" . }}-postgres
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "dataflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          args:
            - "-p"
            - {{ .Values.postgres.port | quote }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.dagster.postgresql.postgresqlUsername | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.global.postgresqlSecretName | default "dataflow-secrets" | quote }}
                  key: postgresql-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command:
                - pg_isready
                - "-h"
                - "127.0.0.1"
                - "-p"
                - {{ .Values.postgres.port | quote }}
                - "-U"
                - {{ .Values.dagster.postgresql.postgresqlUsername | quote }}
                - "-d"
                - {{ .Values.postgres.database | quote }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - pg_isready
                - "-h"
                - "127.0.0.1"
                - "-p"
                - {{ .Values.postgres.port | quote }}
                - "-U"
                - {{ .Values.dagster.postgresql.postgresqlUsername | quote }}
                - "-d"
                - {{ .Values.postgres.database | quote }}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: {{ include "dataflow.name" . }}-postgres
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "dataflow.labels" . | nindent 10 }}
          app.kubernetes.io/component: postgres
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.postgres.storage.storageClass }}
        storageClassName: {{ .Values.postgres.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size | quote }}
{{- end }}
