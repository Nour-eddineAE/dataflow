{{- if .Values.keycloak.enabled }}
{{- $host := required "keycloak.enabled needs gateway.hostname" .Values.gateway.hostname }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dataflow.name" . }}-keycloak-realm
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
data:
  dataflow-realm.json: |
    {{- tpl (.Files.Get "files/dataflow-realm.json") . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dataflow.name" . }}-keycloak
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  selector:
    app.kubernetes.io/component: keycloak
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataflow.name" . }}-keycloak
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: keycloak
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: keycloak
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        checksum/realm: {{ tpl (.Files.Get "files/dataflow-realm.json") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image | quote }}
          args: [start, --import-realm]
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9000}
          env:
            - {name: KC_DB, value: postgres}
            - {name: KC_DB_URL, value: {{ printf "jdbc:postgresql://%s:%v/keycloak" .Values.dagster.postgresql.postgresqlHost .Values.postgres.port | quote }}}
            - {name: KC_DB_USERNAME, value: {{ .Values.dagster.postgresql.postgresqlUsername | quote }}}
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.global.postgresqlSecretName }}, key: postgresql-password}
            - {name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin}
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.global.postgresqlSecretName }}, key: keycloak-admin-password}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ .Values.global.postgresqlSecretName }}, key: oauth2-proxy-client-secret}
            - {name: KC_HTTP_ENABLED, value: "true"}
            - {name: KC_HTTP_RELATIVE_PATH, value: /auth}
            - {name: KC_HOSTNAME, value: {{ printf "https://%s/auth" $host | quote }}}
            - {name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC, value: "true"}
            - {name: KC_PROXY_HEADERS, value: xforwarded}
            - {name: KC_HEALTH_ENABLED, value: "true"}
            - {name: JAVA_OPTS_KC_HEAP, value: -XX:MaxRAMPercentage=65}
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: /auth/health/started, port: management}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /auth/health/ready, port: management}
            periodSeconds: 10
          volumeMounts:
            - {name: realm, mountPath: /opt/keycloak/data/import, readOnly: true}
      volumes:
        - name: realm
          configMap: {name: {{ include "dataflow.name" . }}-keycloak-realm}
{{- end }}
