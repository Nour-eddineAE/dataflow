{{- if .Values.networkPolicies.enabled }}
{{- $control := .Release.Namespace }}
{{- $data := include "dataflow.dataNamespace" . }}
{{- $jobs := include "dataflow.jobsNamespace" . }}
{{- if ne $data $control }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dataflow.name" . }}-data
  namespace: {{ $data }}
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $control }}}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ $jobs }}}
        {{- if .Values.localPorts.enabled }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
        {{- end }}
{{- end }}
{{- if and (ne $jobs $control) (ne $jobs $data) }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dataflow.name" . }}-runs
  namespace: {{ $jobs }}
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
{{- end }}
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dataflow.name" . }}-postgres
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: {{ .Values.postgres.port }}}
{{- end }}
{{- end }}
