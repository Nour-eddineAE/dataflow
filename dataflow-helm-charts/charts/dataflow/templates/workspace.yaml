apiVersion: v1
kind: Service
metadata:
  name: {{ include "dataflow.name" . }}-workspace
spec:
  selector:
    app.kubernetes.io/component: workspace
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dataflow.name" . }}-workspace
  labels:
    {{ include "dataflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.workspace.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/component: workspace
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: workspace
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}
      initContainers:
        - name: dependencies
          image: busybox:1.37
          command: [sh, -c]
          args:
            - until nc -z "$POSTGRES" {{ .Values.postgres.port }} && nc -z "$CLICKHOUSE" 8123; do sleep 2; done
          env:
            - {name: POSTGRES, value: {{ .Values.dagster.postgresql.postgresqlHost | quote }}}
            - {name: CLICKHOUSE, value: {{ include "dataflow.clickhouseHost" . | quote }}}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
      containers:
        - name: workspace
          image: {{ .Values.images.workspace | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          envFrom:
            - secretRef: {name: {{ .Values.global.postgresqlSecretName }}}
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: k8s}
            - {name: POSTGRES_HOST, value: {{ .Values.dagster.postgresql.postgresqlHost | quote }}}
            - {name: POSTGRES_PORT, value: {{ .Values.postgres.port | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.dagster.postgresql.postgresqlUsername | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.global.postgresqlSecretName }}, key: postgresql-password}
            - {name: WORKSPACE_DB, value: workspace}
            - {name: WORKSPACE_HTTP_PORT, value: "8080"}
            - {name: WORKSPACE_AUTH, value: {{ include "dataflow.authMode" . | quote }}}
            - {name: WORKSPACE_OIDC_ISSUER, value: {{ include "dataflow.issuer" . | quote }}}
            - {name: WORKSPACE_OIDC_INTERNAL, value: {{ include "dataflow.issuerInternal" . | quote }}}
            - {name: WORKSPACE_OIDC_CLIENT_ID, value: {{ .Values.auth.clientId | quote }}}
            - {name: WORKSPACE_OIDC_GROUPS_CLAIM, value: {{ .Values.auth.groupsClaim | quote }}}
            - {name: WORKSPACE_OIDC_USERNAME_CLAIM, value: {{ .Values.auth.usernameClaim | quote }}}
            - {name: WORKSPACE_OIDC_ADMINS, value: {{ join "," .Values.auth.admins | quote }}}
            - {name: WORKSPACE_UI_LOCATION, value: /app/ui}
            - {name: WORKSPACE_PERSON_ID, value: local}
            - {name: WORKSPACE_GIT_NAME, value: DataFlow Workspace}
            - {name: WORKSPACE_GIT_EMAIL, value: workspace@dataflow.local}
            - {name: WORKSPACE_GIT_CACHE, value: /var/cache/dataflow/git}
            - {name: WORKSPACE_FILE_REMOTES, value: ""}
            - {name: WORKSPACE_RELEASES_CACHE, value: /var/cache/dataflow/releases}
            - {name: WORKSPACE_PUBLIC_URL, value: {{ ternary (printf "https://%s" .Values.gateway.hostname) "" .Values.gateway.enabled | quote }}}
            - {name: GITHUB_CLIENT_ID, value: ""}
            - {name: GITHUB_CLIENT_SECRET, value: ""}
            - {name: GITHUB_APP_SLUG, value: ""}
            - {name: COMPUTE_MAX_DRIVER_MEMORY, value: {{ .Values.computePolicy.maxDriverMemory | quote }}}
            - {name: COMPUTE_MAX_DRIVER_CORES, value: {{ .Values.computePolicy.maxDriverCores | quote }}}
            - {name: COMPUTE_MAX_EXECUTOR_MEMORY, value: {{ .Values.computePolicy.maxExecutorMemory | quote }}}
            - {name: COMPUTE_MAX_EXECUTOR_CORES, value: {{ .Values.computePolicy.maxExecutorCores | quote }}}
            - {name: COMPUTE_MAX_EXECUTORS, value: {{ .Values.computePolicy.maxExecutors | quote }}}
            - {name: LAKE_ROOT, value: {{ .Values.lake.root | quote }}}
            - {name: LAKE_ENDPOINT, value: {{ include "dataflow.endpoint" . | quote }}}
            - {name: LAKE_S3_REGION, value: {{ .Values.lake.region | quote }}}
            - {name: LAKE_S3_PATH_STYLE, value: {{ .Values.lake.pathStyle | quote }}}
            - {name: RELEASES_BUCKET, value: {{ .Values.releases.bucket | quote }}}
            - {name: RELEASES_TARGET, value: {{ .Values.releases.target | quote }}}
            - {name: CLICKHOUSE_URL, value: {{ printf "http://%s:8123" (include "dataflow.clickhouseHost" .) | quote }}}
            - {name: CLICKHOUSE_USER, value: {{ .Values.clickhouse.user | quote }}}
            - {name: TOWER_GRAPHQL_URL, value: {{ printf "http://%s:80/tower/graphql" (include "dataflow.towerWebserver" .) | quote }}}
            - {name: LINK_TOWER, value: {{ ternary (printf "https://%s/tower" .Values.gateway.hostname) "" .Values.gateway.enabled | quote }}}
            - {name: LINK_OBJECT_STORE, value: ""}
            - {name: LINK_SERVING, value: ""}
            - {name: LINK_DASHBOARDS, value: ""}
            - {name: LINK_MAIL, value: ""}
            - {name: GRAFANA_INTERNAL_URL, value: ""}
            - {name: GRAFANA_TOKEN_FILE, value: ""}
          resources:
            {{- toYaml .Values.workspace.resources | nindent 12 }}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
          volumeMounts:
            - {name: cache, mountPath: /var/cache/dataflow}
      volumes:
        - {name: cache, emptyDir: {}}
