{{- if .Values.externalSecrets.enabled }}
{{- $store := required "externalSecrets.storeName is required" .Values.externalSecrets.storeName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.global.postgresqlSecretName }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store }}
    kind: {{ .Values.externalSecrets.storeKind }}
  target:
    name: {{ .Values.global.postgresqlSecretName }}
    creationPolicy: Owner
  data:
    {{- toYaml .Values.externalSecrets.data | nindent 4 }}
{{- $lake := list }}
{{- range .Values.externalSecrets.data }}
{{- if has .secretKey (list "LAKE_ACCESS_KEY" "LAKE_SECRET_KEY" "CLICKHOUSE_PASSWORD") }}
{{- $lake = append $lake . }}
{{- end }}
{{- end }}
{{- range $namespace := list (include "dataflow.dataNamespace" .) (include "dataflow.jobsNamespace" .) | uniq }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.lakeSecretName }}
  namespace: {{ $namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $store }}
    kind: {{ $.Values.externalSecrets.storeKind }}
  target:
    name: {{ $.Values.lakeSecretName }}
    creationPolicy: Owner
  data:
    {{- toYaml $lake | nindent 4 }}
{{- end }}
{{- end }}
