{{- if .Values.rustfs.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dataflow.name" . }}-rustfs
  namespace: {{ include "dataflow.dataNamespace" . }}
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  type: ClusterIP
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: rustfs
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dataflow.name" . }}-rustfs
  namespace: {{ include "dataflow.dataNamespace" . }}
  labels:
    {{- include "dataflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: rustfs
spec:
  replicas: 1
  serviceName: {{ include "dataflow.name" . }}-rustfs
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: rustfs
  template:
    metadata:
      labels:
        {{- include "dataflow.labels" . | nindent 8 }}
        app.kubernetes.io/component: rustfs
    spec:
      containers:
        - name: rustfs
          image: {{ .Values.rustfs.image | quote }}
          args:
            - /data
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.lakeSecretName | quote }}
                  key: LAKE_ACCESS_KEY
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.lakeSecretName | quote }}
                  key: LAKE_SECRET_KEY
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_CONSOLE_ADDRESS
              value: ":9001"
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
            {{- range $name, $value := .Values.rustfs.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: s3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.rustfs.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "dataflow.labels" . | nindent 10 }}
          app.kubernetes.io/component: rustfs
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.rustfs.storage.storageClass }}
        storageClassName: {{ .Values.rustfs.storage.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.rustfs.storage.size | quote }}
{{- end }}
